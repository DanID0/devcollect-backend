version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devcollect-postgres
    environment:
      POSTGRES_USER: devcollect_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: devcollect_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcollect_user -d devcollect_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - devcollect-network

volumes:
  postgres_data:

networks:
  devcollect-network:
